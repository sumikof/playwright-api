# ------------------------------------------------------------------
# 見本: DB パスワード用 Secret(値は placeholder)
#
# このファイルは kustomization.yaml の resources に含めない。Git に実値を置かないこと。
# 実際の Secret はクラスタ側で作成する:
#
#   oc create secret generic playwright-api-db \
#     --from-literal=DB_ORACLE_PASSWORD='<password>'
#
# deploy/base/deployment.yaml は envFrom.secretRef(optional: true)でこれを読み込む。
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: playwright-api-db
  labels:
    app: playwright-api
type: Opaque
stringData:
  DB_ORACLE_PASSWORD: "CHANGE_ME"
