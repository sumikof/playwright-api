# ------------------------------------------------------------------
# WARNING / 警告:
# このAPIは無認証であり、result.json にリクエストパラメータ
# (password を含む) を保存する。
# 無認証のまま公開しない。認証プロキシ/到達元制限を別途設けること。
# TLS 必須 (このマニフェストでは edge 終端を設定済み)。
#
# Route はこの example overlay でのみ opt-in で有効化される。
# base には含めないこと。
# ------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: playwright-api
  labels:
    app: playwright-api
spec:
  to:
    kind: Service
    name: playwright-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
