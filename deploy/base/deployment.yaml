apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-api
  labels:
    app: playwright-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-api
  template:
    metadata:
      labels:
        app: playwright-api
    spec:
      # shutdown の猶予。内訳: HTTP 応答・ブラウザジョブの drain 上限
      # max(30, DB_QUERY_TIMEOUT_MS/1000 + 5) = 35 秒 + DB_SHUTDOWN_DRAIN_S 10 秒
      # + provider.close / 終了の余裕 20 秒 = 65 秒 → 70 秒。
      # overlay で DB_QUERY_TIMEOUT_MS / DB_SHUTDOWN_DRAIN_S を増やす場合は
      # ceil(max(30, DB_QUERY_TIMEOUT_MS/1000 + 5)) + DB_SHUTDOWN_DRAIN_S + 20 以上に上書きする
      # (起動ログの "Recommended terminationGracePeriodSeconds" と同じ値)。
      terminationGracePeriodSeconds: 70
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright-api
          image: playwright-api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: playwright-api-config
            # DB_ORACLE_PASSWORD を注入する Secret(DB を使わない場合は作らなくてよい)
            - secretRef:
                name: playwright-api-db
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runs
              mountPath: /app/runs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: runs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
