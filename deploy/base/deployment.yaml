apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-api
  labels:
    app: playwright-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-api
  template:
    metadata:
      labels:
        app: playwright-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright-api
          image: playwright-api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: playwright-api-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runs
              mountPath: /app/runs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: runs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
